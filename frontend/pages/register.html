```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | EnergyAnalytics</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .register-section {
            min-height: calc(100vh - 72px - 58px);
            display: flex;
            align-items: center;
            padding: 60px 0;
        }

        .register-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.06);
            max-width: 560px;
            margin: auto;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .register-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .register-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--primary-light);
            color: var(--primary);

            border-radius: 13px;
            font-size: 21px;
        }

        .register-btn-main {
            height: 47px;
            border-radius: 9px;

            font-size: 14px;
            font-weight: 600;
        }

        .login-existing {
            text-align: center;
            margin-top: 22px;

            color: var(--text-muted);
            font-size: 13px;
        }

        .login-existing a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .login-existing a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-light bg-white border-bottom">
        <div class="container">

            <a
                class="navbar-brand d-flex align-items-center gap-2"
                href="../index.html"
            >
                <div class="brand-icon">
                    <i class="bi bi-lightning-charge-fill"></i>
                </div>

                <span class="brand-name">
                    Energy<span>Analytics</span>
                </span>
            </a>

            <a
                href="../index.html"
                class="btn btn-outline-primary btn-sm px-3"
            >
                Back to Login
            </a>

        </div>
    </nav>


    <!-- REGISTRATION -->
    <main class="register-section">

        <div class="container">

            <div class="register-card">

                <div class="register-header">

                    <div class="register-icon">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>

                    <h1>Create your account</h1>

                    <p>
                        Create an account to start analyzing your
                        business energy consumption.
                    </p>

                </div>


                <form id="registerForm">

                    <!-- NAME -->
                    <div class="mb-3">

                        <label
                            for="fullName"
                            class="form-label"
                        >
                            Full name
                        </label>

                        <div class="input-wrapper">

                            <i class="bi bi-person"></i>

                            <input
                                type="text"
                                id="fullName"
                                class="form-control"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>

                    </div>


                    <!-- EMAIL -->
                    <div class="mb-3">

                        <label
                            for="registerEmail"
                            class="form-label"
                        >
                            Email address
                        </label>

                        <div class="input-wrapper">

                            <i class="bi bi-envelope"></i>

                            <input
                                type="email"
                                id="registerEmail"
                                class="form-control"
                                placeholder="you@example.com"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD ROW -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label
                                for="registerPassword"
                                class="form-label"
                            >
                                Password
                            </label>

                            <div class="input-wrapper">

                                <i class="bi bi-lock"></i>

                                <input
                                    type="password"
                                    id="registerPassword"
                                    class="form-control"
                                    placeholder="Create password"
                                    minlength="8"
                                    required
                                >

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label
                                for="confirmPassword"
                                class="form-label"
                            >
                                Confirm password
                            </label>

                            <div class="input-wrapper">

                                <i class="bi bi-lock-fill"></i>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Confirm password"
                                    minlength="8"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- TERMS -->
                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label
                            class="form-check-label"
                            for="terms"
                        >
                            I agree to use this system only for
                            authorized business data.
                        </label>

                    </div>


                    <!-- SUBMIT -->
                    <button
                        type="submit"
                        class="btn btn-primary register-btn-main w-100"
                    >
                        Create Account
                        <i class="bi bi-arrow-right ms-1"></i>
                    </button>

                </form>


                <div class="login-existing">

                    Already have an account?

                    <a href="../index.html">
                        Sign in
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="container">

            <div class="text-center">
                © 2026 EnergyAnalytics
            </div>

        </div>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../js/main.js"></script>

</body>
</html>
```
